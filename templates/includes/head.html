{% load static tailwind_tags django_htmx %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {# ===== Primary Meta Tags ===== #}
    <title>{% block title %}{{ page_title|default:PROJECT_TITLE }}{% endblock %}</title>
    <meta name="title" content="{% block meta_title %}{{ page_title|default:PROJECT_TITLE }}{% endblock %}">
    <meta name="description" content="{% block meta_description %}{{ page_description|default:PROJECT_DESCRIPTION }}{% endblock %}">

    <link rel="icon" type="image/png" href="{% static 'icons/favicon-96x96.png' %}" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="{% static 'icons/favicon.svg' %}">
    <link rel="shortcut icon" href="{% static 'icons/favicon.ico' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'icons/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% static 'icons/site.webmanifest' %}">

    {# ===== Open Graph / Facebook ===== #}
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ request.build_absolute_uri }}">
    <meta property="og:title" content="{% block og_title %}{{ page_title|default:PROJECT_TITLE }}{% endblock %}">
    <meta property="og:description" content="{% block og_description %}{{ page_description|default:PROJECT_DESCRIPTION }}{% endblock %}">
    <meta property="og:image" content="{% block og_image %}{{ PROJECT_DOMAIN }}/static/images/og-image.jpg{% endblock %}">

    {# ===== Canonical URL ===== #}
    <link rel="canonical" href="{% block canonical_url %}{{ request.build_absolute_uri }}{% endblock %}">

    {# ===== Twitter ===== #}
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="{{ request.build_absolute_uri }}">
    <meta name="twitter:title" content="{% block twitter_title %}{{ page_title|default:PROJECT_TITLE }}{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}{{ page_description|default:PROJECT_DESCRIPTION }}{% endblock %}">
    <meta name="twitter:image" content="{% block twitter_image %}{{ PROJECT_DOMAIN }}/static/images/og-image.jpg{% endblock %}">

    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    {% tailwind_css %}
    {% htmx_script %}
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ GTAG_ID }}"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', '{{ GTAG_ID }}');
    </script>
</head>
